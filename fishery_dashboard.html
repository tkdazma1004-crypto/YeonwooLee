<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>어업 생산량 현황 대시보드</title>
<style>
:root{--navy:#17324d;--blue:#2f6f9f;--sky:#eaf3f8;--line:#d9e3ea;--text:#1f2937;--muted:#65758b;--gold:#c98a17;--goldbg:#fff6dc;--card:#fff;--bg:#f5f8fb}
*{box-sizing:border-box} body{margin:0;font-family:Arial,"Noto Sans KR",sans-serif;color:var(--text);background:var(--bg)}
header{background:linear-gradient(135deg,#14334f,#245c80);color:#fff;padding:28px 24px;box-shadow:0 3px 12px #0002}
.head{max-width:1400px;margin:auto;display:flex;justify-content:space-between;gap:20px;align-items:flex-end;flex-wrap:wrap}.title{font-size:30px;font-weight:800;letter-spacing:-.5px}.period{font-size:14px;opacity:.9;background:#ffffff18;border:1px solid #ffffff35;padding:9px 12px;border-radius:10px}
main{max-width:1400px;margin:24px auto;padding:0 18px 40px}.section{margin-bottom:24px}.section h2{font-size:20px;margin:0 0 14px;color:var(--navy)}
.filters{display:flex;gap:12px;flex-wrap:wrap;background:#fff;border:1px solid var(--line);padding:14px;border-radius:14px;margin-bottom:20px;align-items:end}.field{display:flex;flex-direction:column;gap:6px}.field label{font-size:12px;color:var(--muted);font-weight:700}.field select,.field button{height:38px;border:1px solid #c9d5df;border-radius:9px;padding:0 10px;background:#fff}.field button{background:var(--navy);color:#fff;border:none;font-weight:700;cursor:pointer}
.cards{display:grid;grid-template-columns:repeat(4,1fr);gap:14px}.card{background:#fff;border:1px solid var(--line);border-radius:14px;padding:18px;box-shadow:0 3px 10px #17324d0c}.card .label{font-size:13px;color:var(--muted)}.card .value{font-size:27px;font-weight:800;color:var(--navy);margin-top:8px}.card .sub{font-size:12px;color:var(--muted);margin-top:6px}.card.highlight{border:1px solid #e2bd64;background:linear-gradient(180deg,#fffdf6,var(--goldbg))}.card.highlight .value{color:#9a6710}
.grid2{display:grid;grid-template-columns:1fr 1fr;gap:16px}.panel{background:#fff;border:1px solid var(--line);border-radius:14px;padding:18px;box-shadow:0 3px 10px #17324d0c}.panel h3{margin:0 0 12px;font-size:16px;color:var(--navy)}.chartbox{width:100%;height:330px;position:relative}.chartbox svg{width:100%;height:100%;display:block}.legend{display:flex;gap:14px;flex-wrap:wrap;font-size:12px;color:var(--muted);margin-top:8px}.dot{width:10px;height:10px;border-radius:50%;display:inline-block;margin-right:5px}.d1{background:#2f6f9f}.d2{background:#74a8c7}.d3{background:#c98a17}
.tablewrap{overflow:auto;border:1px solid var(--line);border-radius:14px;background:#fff}table{border-collapse:collapse;width:100%;min-width:900px;font-size:13px}th,td{padding:11px 12px;border-bottom:1px solid #e8eef2;text-align:right;white-space:nowrap}th:first-child,td:first-child{text-align:center}thead th{background:#edf4f8;color:var(--navy);position:sticky;top:0;cursor:pointer;user-select:none}tbody tr:hover{background:#f8fbfd}tbody tr.top-year{background:#fff8e7;font-weight:700}tfoot td{background:#eaf1f6;font-weight:800;color:var(--navy)}.badge{display:inline-block;background:#d7981d;color:#fff;font-size:10px;padding:2px 6px;border-radius:20px;margin-left:4px}
.note{font-size:12px;color:var(--muted);margin-top:10px;line-height:1.6}.empty{display:flex;align-items:center;justify-content:center;height:100%;color:var(--muted);font-size:14px}
@media(max-width:980px){.cards{grid-template-columns:repeat(2,1fr)}.grid2{grid-template-columns:1fr}.title{font-size:25px}}
@media(max-width:580px){header{padding:22px 16px}.cards{grid-template-columns:1fr}.title{font-size:22px}.filters{align-items:stretch}.field{width:100%}.field select,.field button{width:100%}.chartbox{height:280px}}
</style>
</head>
<body>
<header><div class="head"><div><div class="title">어업 생산량 현황 대시보드</div><div style="margin-top:7px;font-size:14px;opacity:.85">정책 보고용 · 품종별 어업생산량 분석</div></div><div class="period">데이터 기간: 2001~2013년 · 단위: 천 M/T</div></div></header>
<main>
<section class="section">
<div class="filters">
<div class="field"><label>시작 연도</label><select id="startYear"></select></div>
<div class="field"><label>종료 연도</label><select id="endYear"></select></div>
<div class="field"><label>품종 선택</label><select id="species"><option value="all">전체 품종</option><option>어류</option><option>패류</option><option>갑각류</option><option>연체동물</option><option>기타수산동물</option><option>해조류</option></select></div>
<div class="field"><label>&nbsp;</label><button id="resetBtn">필터 초기화</button></div>
</div>
<h2>요약</h2><div class="cards" id="cards"></div>
</section>
<section class="section"><h2>시각화</h2><div class="grid2">
<div class="panel"><h3>연도별 총 생산량(계) 추이</h3><div class="chartbox" id="lineChart"></div><div class="note">2008년 최고 생산 연도를 금색으로 강조했습니다.</div></div>
<div class="panel"><h3 id="barTitle">품종별 생산량 합계</h3><div class="chartbox" id="barChart"></div><div class="note" id="barNote">선택한 기간의 품종별 누적 생산량입니다.</div></div>
<div class="panel" style="grid-column:1/-1"><h3>어류 vs 해조류 생산량 비교</h3><div class="chartbox" id="compareChart"></div><div class="legend"><span><i class="dot d1"></i>어류</span><span><i class="dot d2"></i>해조류</span><span><i class="dot d3"></i>2008년 총생산 최고연도</span></div></div>
</div></section>
<section class="section"><h2>연도별 데이터 표</h2><div class="tablewrap"><table id="dataTable"><thead><tr></tr></thead><tbody></tbody><tfoot><tr></tr></tfoot></table></div><div class="note">열 제목을 클릭하면 해당 기준으로 오름차순/내림차순 정렬됩니다. 합계 행은 현재 선택된 연도 범위 기준입니다.</div></section>
</main>
<script>
const raw=[
{연도:2001,계:2665,어류:1467,패류:283,갑각류:74,연체동물:413,기타수산동물:39,해조류:388},{연도:2002,계:2476,어류:1202,패류:272,갑각류:72,연체동물:394,기타수산동물:27,해조류:508},{연도:2003,계:2487,어류:1144,패류:403,갑각류:89,연체동물:379,기타수산동물:15,해조류:457},{연도:2004,계:2519,어류:1157,패류:410,갑각류:85,연체동물:306,기타수산동물:15,해조류:546},{연도:2005,계:2714,어류:1265,패류:409,갑각류:92,연체동물:295,기타수산동물:16,해조류:636},{연도:2006,계:3032,어류:1261,패류:474,갑각류:110,연체동물:392,기타수산동물:17,해조류:778},{연도:2007,계:3275,어류:1330,패류:555,갑각류:124,연체동물:432,기타수산동물:23,해조류:811},{연도:2008,계:3361,어류:1448,패류:428,갑각류:126,연체동물:402,기타수산동물:23,해조류:935},{연도:2009,계:3182,어류:1425,패류:420,갑각류:132,연체동물:312,기타수산동물:24,해조류:870},{연도:2010,계:3111,어류:1331,패류:440,갑각류:147,연체동물:256,기타수산동물:22,해조류:915},{연도:2011,계:3256,어류:1356,패류:467,갑각류:130,연체동물:269,기타수산동물:28,해조류:1007},{연도:2012,계:3183,어류:1268,패류:433,갑각류:135,연체동물:293,기타수산동물:23,해조류:1032},{연도:2013,계:3135,어류:1195,패류:346,갑각류:149,연체동물:282,기타수산동물:23,해조류:1140}
];
const cols=['연도','계','어류','패류','갑각류','연체동물','기타수산동물','해조류'], speciesCols=cols.slice(2); let sortKey='연도', sortDir=1;
const fmt=n=>Number(n).toLocaleString('ko-KR');
function init(){const s=document.getElementById('startYear'),e=document.getElementById('endYear');raw.forEach(r=>{s.add(new Option(r.연도,r.연도));e.add(new Option(r.연도,r.연도))});s.value=2001;e.value=2013;['startYear','endYear','species'].forEach(id=>document.getElementById(id).addEventListener('change',update));document.getElementById('resetBtn').onclick=()=>{s.value=2001;e.value=2013;document.getElementById('species').value='all';sortKey='연도';sortDir=1;update()};buildHeader();update();window.addEventListener('resize',()=>{clearTimeout(window.__r);window.__r=setTimeout(updateCharts,120)})}
function filtered(){let a=+document.getElementById('startYear').value,b=+document.getElementById('endYear').value;if(a>b){[a,b]=[b,a]}return raw.filter(r=>r.연도>=a&&r.연도<=b)}
function sums(data){let o={};cols.slice(1).forEach(c=>o[c]=data.reduce((a,r)=>a+r[c],0));return o}
function update(){const data=filtered();renderCards(data);renderTable(data);updateCharts()}
function renderCards(data){const total=sums(data);const peak=data.length?data.reduce((a,b)=>a.계>b.계?a:b):null;const avg=data.length?Math.round(total.계/data.length):0;const selected=document.getElementById('species').value;const spVal=selected==='all'?total.계:data.reduce((a,r)=>a+r[selected],0);cards.innerHTML=`<div class="card"><div class="label">기간 총 생산량</div><div class="value">${fmt(total.계||0)}</div><div class="sub">천 M/T · ${data.length}개 연도</div></div><div class="card"><div class="label">연평균 총 생산량</div><div class="value">${fmt(avg)}</div><div class="sub">천 M/T</div></div><div class="card highlight"><div class="label">최고 생산 연도</div><div class="value">${peak?peak.연도:'-'}</div><div class="sub">${peak?fmt(peak.계)+'천 M/T':'데이터 없음'}</div></div><div class="card"><div class="label">${selected==='all'?'선택기간 총계':selected+' 누적 생산량'}</div><div class="value">${fmt(spVal||0)}</div><div class="sub">천 M/T · 품종 필터 연동</div></div>`}
function buildHeader(){const tr=document.querySelector('#dataTable thead tr');tr.innerHTML='';cols.forEach(c=>{const th=document.createElement('th');th.textContent=c==='계'?'계 (천 M/T)':c;th.onclick=()=>{if(sortKey===c)sortDir*=-1;else{sortKey=c;sortDir=1}renderTable(filtered())};tr.appendChild(th)})}
function renderTable(data){const arr=[...data].sort((a,b)=>(a[sortKey]-b[sortKey])*sortDir),tb=document.querySelector('#dataTable tbody');tb.innerHTML='';arr.forEach(r=>{const tr=document.createElement('tr');if(r.연도===2008)tr.className='top-year';cols.forEach((c,i)=>{const td=document.createElement('td');td.innerHTML=i===0&&r.연도===2008?`${r[c]} <span class="badge">최고</span>`:fmt(r[c]);tr.appendChild(td)});tb.appendChild(tr)});const total=sums(data),tf=document.querySelector('#dataTable tfoot tr');tf.innerHTML=`<td>합계</td>${cols.slice(1).map(c=>`<td>${fmt(total[c]||0)}</td>`).join('')}`}
function svgWrap(content){return `<svg viewBox="0 0 900 330" preserveAspectRatio="none" aria-hidden="true">${content}</svg>`}
function lineChart(data){if(!data.length)return '<div class="empty">표시할 데이터가 없습니다.</div>';const W=900,H=330,L=62,R=20,T=28,B=48,vals=data.map(d=>d.계),min=Math.floor((Math.min(...vals)-100)/200)*200,max=Math.ceil((Math.max(...vals)+100)/200)*200,x=i=>L+i*(W-L-R)/Math.max(1,data.length-1),y=v=>T+(max-v)*(H-T-B)/(max-min);let s='';for(let i=0;i<5;i++){let v=min+(max-min)*i/4,yy=y(v);s+=`<line x1="${L}" x2="${W-R}" y1="${yy}" y2="${yy}" stroke="#e5ebef"/><text x="${L-10}" y="${yy+4}" text-anchor="end" font-size="11" fill="#708090">${Math.round(v)}</text>`}let pts=data.map((d,i)=>`${x(i)},${y(d.계)}`).join(' ');s+=`<polyline fill="none" stroke="#2f6f9f" stroke-width="3" points="${pts}"/>`;data.forEach((d,i)=>{const peak=d.연도===2008;s+=`<circle cx="${x(i)}" cy="${y(d.계)}" r="${peak?6:4}" fill="${peak?'#c98a17':'#2f6f9f'}"/><text x="${x(i)}" y="${H-18}" text-anchor="middle" font-size="11" fill="#667788">${d.연도}</text>${peak?`<text x="${x(i)}" y="${y(d.계)-12}" text-anchor="middle" font-size="12" font-weight="700" fill="#9a6710">3,361</text>`:''}`});return svgWrap(s)}
function renderBarSvg(data){if(!data.length)return '<div class="empty">표시할 데이터가 없습니다.</div>';const selected=document.getElementById('species').value;let cats=selected==='all'?speciesCols:[selected],tot=sums(data),items=cats.map(c=>({name:c,val:tot[c]}));const W=900,H=330,L=72,R=30,T=28,B=52,max=Math.max(...items.map(x=>x.val))*1.12||1,bw=(W-L-R)/items.length*.58;let s='';for(let i=0;i<5;i++){let v=max*i/4,yy=H-B-v*(H-T-B)/max;s+=`<line x1="${L}" x2="${W-R}" y1="${yy}" y2="${yy}" stroke="#e8edf0"/><text x="${L-10}" y="${yy+4}" text-anchor="end" font-size="11" fill="#708090">${Math.round(v).toLocaleString()}</text>`}items.forEach((it,i)=>{let cx=L+(i+.5)*(W-L-R)/items.length,h=it.val*(H-T-B)/max,yy=H-B-h;s+=`<rect x="${cx-bw/2}" y="${yy}" width="${bw}" height="${h}" rx="5" fill="#2f6f9f"/><text x="${cx}" y="${H-23}" text-anchor="middle" font-size="11" fill="#667788">${it.name}</text><text x="${cx}" y="${yy-8}" text-anchor="middle" font-size="11" fill="#274e6b">${fmt(it.val)}</text>`});return svgWrap(s)}
function renderCompareSvg(data){if(!data.length)return '<div class="empty">표시할 데이터가 없습니다.</div>';const W=900,H=330,L=62,R=20,T=24,B=48,max=Math.max(...data.flatMap(d=>[d.어류,d.해조류]))*1.1,x=i=>L+i*(W-L-R)/Math.max(1,data.length-1),y=v=>T+(max-v)*(H-T-B)/max;let s='';for(let i=0;i<5;i++){let v=max*i/4,yy=y(v);s+=`<line x1="${L}" x2="${W-R}" y1="${yy}" y2="${yy}" stroke="#e8edf0"/><text x="${L-10}" y="${yy+4}" text-anchor="end" font-size="11" fill="#708090">${Math.round(v)}</text>`}const p1=data.map((d,i)=>`${x(i)},${y(d.어류)}`).join(' '),p2=data.map((d,i)=>`${x(i)},${y(d.해조류)}`).join(' ');s+=`<polyline fill="none" stroke="#2f6f9f" stroke-width="3" points="${p1}"/><polyline fill="none" stroke="#74a8c7" stroke-width="3" points="${p2}"/>`;data.forEach((d,i)=>{let xx=x(i);if(d.연도===2008)s+=`<line x1="${xx}" x2="${xx}" y1="${T}" y2="${H-B}" stroke="#c98a17" stroke-width="2" stroke-dasharray="5 5"/>`;s+=`<circle cx="${xx}" cy="${y(d.어류)}" r="3.5" fill="#2f6f9f"/><circle cx="${xx}" cy="${y(d.해조류)}" r="3.5" fill="#74a8c7"/><text x="${xx}" y="${H-18}" text-anchor="middle" font-size="11" fill="#667788">${d.연도}</text>`});return svgWrap(s)}
function updateCharts(){const data=filtered();const sp=document.getElementById('species').value;document.getElementById('lineChart').innerHTML=lineChart(data);document.getElementById('barTitle').textContent=sp==='all'?'품종별 생산량 합계':`${sp} 생산량 합계`;document.getElementById('barNote').textContent=sp==='all'?'선택한 기간의 품종별 누적 생산량입니다.':`선택한 기간의 ${sp} 누적 생산량입니다.`;document.getElementById('barChart').innerHTML=renderBarSvg(data);document.getElementById('compareChart').innerHTML=renderCompareSvg(data)}
init();
</script>
</body></html>
